{% set name = "seamm-datastore" %}
{% set version = "2026.10.1" %}
{% set sha256 = "f1bb1d5bc87260ff0bc9cf81d9492547a40adb9c9f3d7510ece4051e92e56621" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/seamm-datastore/seamm_datastore-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools
  run:
    - flask
    - flask-authorize
    - marshmallow
    - marshmallow-sqlalchemy
    - python >={{ python_min }}
    - python-dateutil
    - six
    - sqlalchemy
    - werkzeug

test:
  imports:
    - seamm_datastore
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://github.com/molssi-seamm/seamm_datastore
  summary: A Python package for handling the SEAMM Dashboard database
  license: BSD-3-Clause
  license_file: LICENSE
  doc_url: https://molssi-seamm.github.io/seamm-datastore/

extra:
  recipe-maintainers:
    - paulsaxe
